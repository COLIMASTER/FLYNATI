<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel privado | Alfonso & Natalia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}" />
  </head>
  <body class="admin-body">
    <div class="admin-shell">
      <div class="admin-card">
        <p class="eyebrow">Acceso privado</p>
        <h1>Panel de invitados</h1>
        <p class="admin-text">
          Introduce la clave secreta para acceder al panel de confirmaciones.
        </p>
        <form class="admin-form" method="get" action="/admin">
          <label for="admin-key">Clave</label>
          <input id="admin-key" name="key" type="password" placeholder="Clave privada" required />
          <button class="btn" type="submit">Entrar</button>
        </form>
        {% if not admin_key_required %}
        <p class="admin-note">Configura ADMIN_KEY en el entorno para activar el acceso.</p>
        {% else %}
        <p class="admin-note">Si no tienes clave, contacta con los novios.</p>
        {% endif %}
      </div>
    </div>
  </body>
</html>
