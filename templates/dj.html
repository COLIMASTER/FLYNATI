<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vista DJ | Alfonso & Natalia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dj.css') }}" />
  </head>
  <body class="dj-body">
    <div class="dj-shell">
      <header class="dj-header">
        <div>
          <p class="eyebrow">Vista DJ</p>
          <h1>Ranking de canciones</h1>
          <p class="dj-text">Actualiza en tiempo real y sigue el top en directo.</p>
        </div>
        <div class="dj-actions">
          <button class="btn btn-outline" id="dj-refresh">Actualizar</button>
          <a class="btn btn-outline" href="/admin?key={{ admin_key }}">Panel admin</a>
          <a class="btn btn-outline" href="/">Volver a la web</a>
        </div>
      </header>

      <section class="dj-section">
        <h2>Top 10</h2>
        <ol class="dj-top-list" id="dj-top-list"></ol>
      </section>

      <section class="dj-section">
        <h2>Todas las propuestas</h2>
        <div class="dj-all-list" id="dj-all-list"></div>
      </section>

      <p class="dj-foot">Última actualización: <span id="dj-last-update">--</span></p>
    </div>

    <script src="{{ url_for('static', filename='js/dj.js') }}"></script>
  </body>
</html>
